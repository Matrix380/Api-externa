<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>InfoPokemon</title>
</head>
<body>

    <main>
        <h1>Buscar Pokémon</h1>

        <form id="formPoke">
            <input
            type="number"
            id="idPoke"
            placeholder="Digite o ID"
            min="1"
            required>

            <button type="submit">Buscar</button>
        </form>

        <p id="msg"></p>

        <div id="resultado">
            <h2 id="nomePokemon"></h2>
            <p>Normal</p>
            <img src="" alt="Imagem do Pokémon normal" id="imgPoke">
            <p>Shiny</p>
            <img src="" alt="Imagem do Pokémon shiny" id="imgPokeshiny">

            <p>Peso:<span id="PesoPoke"><span>gramas</p>

            <p>move:<span id="MovePoke"><span></p>
                
            <p>Abilidade:<span id="AbilPoke"><span></p>

            <p>Tipo:<span id="TypePoke"><span></p>

            <audio id="audioPoke" controls></audio>
        </div>

    </main>  
   
    <script src="main.js"></script>
</body>
</html>
